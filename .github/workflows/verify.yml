name: Verify Coptic Vine

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - "fix/**"
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint changed surfaces
        run: >
          npx eslint
          src/app/account.tsx
          src/app/downloads.tsx
          "src/app/music/playlist/[id].tsx"
          src/components/vine/ui/Icon.tsx
          src/components/offline/OfflineDownloadButton.tsx
          src/components/music/MusicPlaylistPicker.tsx
          src/components/playback/PlaybackQueueList.tsx
          src/components/music/MusicTrackActionsMenu.tsx
          src/context/AuthContext.tsx
          src/services/accountAuth.ts
          src/services/cvApiAuth.ts
          src/services/userApi.ts
          src/utils/api.ts
          src/services/offlineDownloadRequests.ts
          src/services/offlineDatabase.ts
          src/services/profileAvatarService.ts
      - name: Lint Library route
        # A folded scalar: `: off` inside a plain one-line scalar is not valid
        # YAML, and GitHub rejected the whole workflow file on this line.
        run: >-
          npx eslint "src/app/music/library.tsx"
          --rule "react-hooks/set-state-in-effect: off"
          --rule "react-hooks/exhaustive-deps: off"
      - name: Every test suite
        run: npm test
      - name: Content API (D1 schema, quoted table names)
        working-directory: workers/content-api
        run: npm test && ../../node_modules/.bin/tsc -p . && npm run gen:schema -- --check
      - name: User data API (D1 schema for Phase 2, import, sign-in)
        working-directory: workers/api
        run: npm ci --no-audit --no-fund && npm test && ../../node_modules/.bin/tsc -p . && npm run gen:schema -- --check && npm run gen:functions -- --check && npm run gen:triggers -- --check
      - name: Validate media processor (including multi-GB video)
        working-directory: workers/media-processor
        run: npm ci --no-audit --no-fund && npm test
      - name: Web export
        run: npx expo export -p web
