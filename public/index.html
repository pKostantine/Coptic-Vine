<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14301B" />
    <meta name="color-scheme" content="dark" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The web app manifest (public/manifest.json, icons from
         scripts/build-web-icons.mjs) lets a browser install the site, and
         added to a home screen it opens as an app of its own: no browser
         chrome, the deep green running behind the status bar — the layout
         already keeps clear of the notch (viewport-fit=cover above). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Coptic Vine" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Coptic Vine</title>
    <!-- COPTIC_VINE_SHARE_META_START -->
    <meta name="description" content="Cross-platform Coptic Orthodox worship app for multilingual liturgical books, Scripture, and hymns." />
    <link rel="canonical" href="https://copticvine.ca/" />
    <meta property="og:site_name" content="Coptic Vine" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Coptic Vine" />
    <meta property="og:description" content="Cross-platform Coptic Orthodox worship app for multilingual liturgical books, Scripture, and hymns." />
    <meta property="og:url" content="https://copticvine.ca/" />
    <!-- The seal, on a 1200x630 card. WhatsApp and iMessage both read these:
         absolute URL, declared type and size, and no alpha, which some clients
         render black and others white. -->
    <meta property="og:image" content="https://copticvine.ca/coptic-vine-share.png" />
    <meta property="og:image:secure_url" content="https://copticvine.ca/coptic-vine-share.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Coptic Vine seal" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Coptic Vine" />
    <meta name="twitter:description" content="Cross-platform Coptic Orthodox worship app for multilingual liturgical books, Scripture, and hymns." />
    <meta name="twitter:image" content="https://copticvine.ca/coptic-vine-share.png" />
    <meta name="twitter:image:alt" content="The Coptic Vine seal" />
    <!-- COPTIC_VINE_SHARE_META_END -->
    <!-- web.output: "single" uses this template, not src/app/+html.tsx. -->
    <script>
      // Safari on iPhone and iPad zooms the page into a field set smaller
      // than 16px as it is focused, and keeps scrolling with the caret, so
      // only the end of what is typed stays in view (Beta Feedback #4, an
      // Other Canon's name). maximum-scale=1 stops that zoom; iOS still lets
      // the reader pinch to zoom. Android would lose pinching to it, so it
      // is set on iOS alone (an iPad asks as a Mac with a touch screen).
      (function () {
        var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var viewport = document.querySelector('meta[name="viewport"]');
        if (ios && viewport && !/maximum-scale/.test(viewport.content)) viewport.content += ', maximum-scale=1';
      })();
    </script>
    <style id="expo-reset">
      html,
      body,
      #root {
        height: 100%;
        background-color: #14301B;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      #root {
        display: flex;
        flex: 1;
      }
      /* The book slideshow uses explicit user-selected font sizes; never inflate
         its text when the phone rotates or its width changes. Do not apply
         this to the whole app: other screens keep browser accessibility text. */
      [data-testid="slideshow-container"] {
        -webkit-text-size-adjust: none;
        text-size-adjust: none;
      }
      /* A card's background is often a gradient laid over the whole card
         (absoluteFill), which the browser paints above anything unpositioned
         drawn after it: a field in such a card (an Other Canon's name, Beta
         Feedback #4) took taps but its box and text were hidden. Fields are
         positioned, so they paint in their place, above the card's ground. */
      input,
      textarea {
        position: relative;
      }
      /* Follow Safari's visible viewport as its toolbars expand or collapse. */
      @supports (height: 100dvh) {
        body {
          height: 100dvh;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
